name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-13 # Intel runners; still the widest-compat macOS target
            target: x86_64-apple-darwin
          - os: macos-14 # Apple Silicon runners
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/localshare" dist/
          tar -C dist -czf "localshare-${{ matrix.target }}.tar.gz" localshare

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/localshare.exe" dist/
          Compress-Archive -Path dist/localshare.exe -DestinationPath "localshare-${{ matrix.target }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: localshare-${{ matrix.target }}
          path: localshare-${{ matrix.target }}.*
          if-no-files-found: error

      - name: Attach archives to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: localshare-${{ matrix.target }}.*
          generate_release_notes: true