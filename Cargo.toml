[package]
name = "localshare"
version = "0.1.0"
edition = "2021"
description = "Share a local HTTP server with the internet in one command"
license = "MIT"

[[bin]]
name = "localshare"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
url = "2"
rand = "0.8"
httparse = "1.8"
tungstenite = "0.21"
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "async-await", "alloc"] }
qrcode = { version = "0.14", default-features = false }
colored = "2"

[dev-dependencies]
tokio-test = "0.4"
assert_cmd = "2"
predicates = "3"
