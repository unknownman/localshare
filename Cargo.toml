[package]
name = "localshare"
version = "0.1.1"
edition = "2021"
description = "Instantly share a local HTTP server with the internet"
license = "MIT"
authors = ["Ali Joder <ali.masoudi.alavi@gmail.com>"]
repository = "https://github.com/unknownman/localshare"
homepage = "https://github.com/unknownman/localshare"
readme = "README.md"
keywords = ["tunnel", "localhost", "ngrok", "cli", "developer-tools"]
categories = ["command-line-utilities", "development-tools", "network-programming"]

[[bin]]
name = "localshare"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
url = "2"
rand = "0.8"
httparse = "1.8"
tungstenite = "0.21"
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "async-await", "alloc"] }
qrcode = { version = "0.14", default-features = false }
colored = "2"

[dev-dependencies]
tokio-test = "0.4"
assert_cmd = "2"
predicates = "3"

[target.'cfg(unix)'.dev-dependencies]
# Send SIGINT/SIGTERM to the spawned binary in integration tests.
libc = "0.2"
